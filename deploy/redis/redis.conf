# ============================================================================
#  FinderNate — extra Redis directives for Coolify's BUILT-IN Redis
# ----------------------------------------------------------------------------
#  Coolify already manages the password, private networking, the data volume,
#  and the container itself. You do NOT run this as a separate compose service.
#
#  HOW TO APPLY:
#    Coolify → your Redis resource → Configuration →
#    "Custom Redis Configuration" → paste the directives below → Save → Restart.
#
#  Do NOT add requirepass / bind / port / dir here — Coolify injects those.
#  Adding them can clash with Coolify's own startup flags.
# ============================================================================

# ── Fix 1: protect the BullMQ "like-sync" queue from data loss ──────────────
# noeviction = Redis NEVER auto-deletes keys to free memory. This is the one
# setting that matters most: if a queued like-job were evicted, that like would
# never reach MongoDB. TTL'd cache keys still expire normally (expiry is
# independent of eviction), so the cache still cleans itself up.
maxmemory-policy noeviction

# Redis's own ceiling. Keep this a bit BELOW the Coolify resource memory limit
# (set that to ~4 GB) so there's headroom for AOF buffers + snapshot fork.
# The real working set here is small; this is a safety cap. Tune as you grow.
maxmemory 3gb

# ── Fix 2: survive restarts / deploys / reboots (durability) ────────────────
# Append-only log = every write is recorded to disk and replayed on restart,
# so a redeploy or crash can't drop pending like-jobs or live counters.
appendonly yes
appendfsync everysec

# ── Fix 4 (app feature): cache-warmer expiry events ─────────────────────────
# 'Ex' = emit "key expired" events. The cache warmer listens for these and
# re-seeds counters/lists from MongoDB the moment a key expires. The app also
# sets this at runtime via CONFIG SET, but setting it here makes it survive
# restarts.
notify-keyspace-events Ex
